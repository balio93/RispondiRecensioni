<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi — Replica</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 py-4">
      <a href="index.html" class="text-xl font-bold text-gray-800">Replica</a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-lg shadow p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Accedi</h1>
        <p class="text-sm text-gray-500 mb-6">Bentornato su Replica.</p>

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="email" type="email" required placeholder="tu@email.com"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="password" type="password" required placeholder="••••••••"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <button id="btnSubmit" type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
            Accedi
          </button>

          <p id="messaggio" class="text-sm text-center hidden"></p>
        </form>

        <p class="text-sm text-gray-500 text-center mt-6">
          Non hai un account?
          <a href="signup.html" class="text-blue-600 hover:underline font-medium">Registrati gratis</a>
        </p>
      </div>

      <p class="text-xs text-gray-400 text-center mt-6">
        <a href="index.html" class="hover:underline">← Torna alla home</a>
      </p>
    </div>
  </main>

<script>
// ⚠️ SOSTITUISCI QUESTI DUE VALORI CON I TUOI (gli stessi di signup.html)
const SUPABASE_URL = "https://htixuodbcfdvvlspedtl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0aXh1b2RiY2ZkdnZsc3BlZHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjE3NjIsImV4cCI6MjEwNTMzNzc2Mn0.Kw1D3_7U8Y5vUcEeJen9aoLQmUGHVzlUEpSWTodBpp4";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('loginForm');
const btn = document.getElementById('btnSubmit');
const msg = document.getElementById('messaggio');

// Se l'utente è già loggato, mandalo direttamente a app.html
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    window.location.href = 'app.html';
  }
})();

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  msg.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Accesso in corso...';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    window.location.href = 'app.html';
  } catch (err) {
    let messaggio = err.message;
    if (messaggio.includes('Invalid login credentials')) {
      messaggio = 'Email o password non corretti.';
    } else if (messaggio.includes('Email not confirmed')) {
      messaggio = 'Devi prima confermare la tua email. Controlla la casella.';
    }
    msg.textContent = messaggio;
    msg.className = 'text-sm text-center mt-2 text-red-600';
    msg.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Accedi';
  }
});
</script>
</body>
</html>
