<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrati — Replica</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 py-4">
      <a href="index.html" class="text-xl font-bold text-gray-800">Replica</a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-lg shadow p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Crea il tuo account</h1>
        <p class="text-sm text-gray-500 mb-6">Gratis, 3 risposte al giorno. Nessuna carta di credito.</p>

        <form id="signupForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="email" type="email" required placeholder="tu@email.com"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="password" type="password" required minlength="6" placeholder="Almeno 6 caratteri"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Conferma password</label>
            <input id="password2" type="password" required minlength="6" placeholder="Ripeti la password"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <label class="flex items-start text-sm text-gray-600">
            <input id="termini" type="checkbox" required class="mt-1 mr-2">
            <span>Accetto la <a href="privacy.html" class="text-blue-600 hover:underline">Privacy Policy</a> e i termini del servizio.</span>
          </label>

          <button id="btnSubmit" type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition disabled:opacity-50 disabled:cursor-not-allowed">
            Crea account gratuito
          </button>

          <p id="messaggio" class="text-sm text-center hidden"></p>
        </form>

        <p class="text-sm text-gray-500 text-center mt-6">
          Hai già un account?
          <a href="login.html" class="text-blue-600 hover:underline font-medium">Accedi</a>
        </p>
      </div>

      <p class="text-xs text-gray-400 text-center mt-6">
        <a href="index.html" class="hover:underline">← Torna alla home</a>
      </p>
    </div>
  </main>

<script>
// ⚠️ SOSTITUISCI QUESTI DUE VALORI CON I TUOI (li trovi in Supabase → Settings → API)
const SUPABASE_URL = "https://htixuodbcfdvvlspedtl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0aXh1b2RiY2ZkdnZsc3BlZHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjE3NjIsImV4cCI6MjEwNTMzNzc2Mn0.Kw1D3_7U8Y5vUcEeJen9aoLQmUGHVzlUEpSWTodBpp4";
// Inizializza il client Supabase
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('signupForm');
const btn = document.getElementById('btnSubmit');
const msg = document.getElementById('messaggio');

function mostraMessaggio(testo, tipo) {
  msg.textContent = testo;
  msg.className = 'text-sm text-center mt-2 ' + (tipo === 'errore' ? 'text-red-600' : 'text-green-600');
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  msg.classList.add('hidden');

  if (password !== password2) {
    mostraMessaggio('Le password non coincidono.', 'errore');
    msg.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creazione account...';

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) throw error;

    // Se Supabase richiede conferma email
    if (data.user && !data.session) {
      mostraMessaggio('Account creato! Controlla la tua email per confermare.', 'successo');
      msg.classList.remove('hidden');
      form.reset();
    } else {
      // Login automatico dopo la registrazione
      mostraMessaggio('Account creato! Reindirizzamento...', 'successo');
      msg.classList.remove('hidden');
      setTimeout(() => { window.location.href = 'app.html'; }, 1000);
    }
  } catch (err) {
    let messaggio = err.message;
    if (messaggio.includes('already registered')) {
      messaggio = 'Questa email è già registrata. Prova ad accedere.';
    } else if (messaggio.includes('Password should be')) {
      messaggio = 'La password è troppo corta (minimo 6 caratteri).';
    } else if (messaggio.includes('Invalid email')) {
      messaggio = 'L\'indirizzo email non è valido.';
    }
    mostraMessaggio(messaggio, 'errore');
    msg.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Crea account gratuito';
  }
});
</script>
</body>
</html>
