<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrati — Replica</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 py-4">
      <a href="index.html" class="text-xl font-bold text-gray-800">Replica</a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-lg shadow p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Crea il tuo account</h1>
        <p class="text-sm text-gray-500 mb-6">Gratis, 3 risposte al giorno. Nessuna carta di credito.</p>

        <form id="signupForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="email" type="email" required placeholder="tu@email.com"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="password" type="password" required minlength="6" placeholder="Almeno 6 caratteri"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Conferma password</label>
            <input id="password2" type="password" required minlength="6" placeholder="Ripeti la password"
              class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <label class="flex items-start text-sm text-gray-600">
            <input id="termini" type="checkbox" required class="mt-1 mr-2">
            <span>Accetto la <a href="privacy.html" class="text-blue-600 hover:underline">Privacy Policy</a> e i termini del servizio.</span>
          </label>

          <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition">
            Crea account gratuito
          </button>

          <p id="messaggio" class="text-sm text-center hidden"></p>
        </form>

        <p class="text-sm text-gray-500 text-center mt-6">
          Hai già un account?
          <a href="login.html" class="text-blue-600 hover:underline font-medium">Accedi</a>
        </p>
      </div>

      <p class="text-xs text-gray-400 text-center mt-6">
        <a href="index.html" class="hover:underline">← Torna alla home</a>
      </p>
    </div>
  </main>

<script>
// ⚠️ La logica di registrazione arriverà nello Step 2
document.getElementById('signupForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const msg = document.getElementById('messaggio');
  const pwd = document.getElementById('password').value;
  const pwd2 = document.getElementById('password2').value;

  if (pwd !== pwd2) {
    msg.textContent = 'Le password non coincidono.';
    msg.className = 'text-sm text-center text-red-600 mt-2';
    return;
  }

  msg.textContent = 'La registrazione sarà attivata a breve.';
  msg.className = 'text-sm text-center text-blue-600 mt-2';
});
</script>
</body>
</html>
